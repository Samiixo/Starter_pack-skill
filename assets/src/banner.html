<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1600px; height:640px; background:#090909; font-family:'Segoe UI',system-ui,sans-serif; color:#f2f2f2; display:flex; flex-direction:column; justify-content:center; padding:0 90px; }
  .kicker { font-family:Consolas,monospace; font-size:19px; letter-spacing:.22em; color:#D6FF00; text-transform:uppercase; margin-bottom:22px; }
  h1 { font-size:82px; font-weight:700; line-height:1.04; letter-spacing:-.02em; }
  h1 .thin { font-weight:200; color:#8a8a8a; }
  .sub { margin-top:26px; font-size:26px; font-weight:300; color:#b9b9b9; max-width:1120px; line-height:1.42; }
  .row { margin-top:42px; display:flex; gap:13px; flex-wrap:wrap; }
  .tag { font-family:Consolas,monospace; font-size:18px; padding:9px 16px; border:1px solid #2a2a2a; color:#cfcfcf; }
  .tag.hot { border-color:#D6FF00; color:#D6FF00; }
</style></head><body>
  <div class="kicker">v2.0 &nbsp;/&nbsp; starter-pack</div>
  <h1>Ритм проекта<br><span class="thin">в четырёх файлах</span></h1>
  <div class="sub">Агент не читает файлы наугад: каталог говорит, где что лежит, карта - что опасно, журнал - на чём остановились. И всё это <span style="color:#D6FF00">проверяется машинно</span>.</div>
  <div class="row">
    <div class="tag hot">AGENTS.md</div>
    <div class="tag hot">INDEX.md</div>
    <div class="tag hot">MAP.md</div>
    <div class="tag hot">STATE-LOG.md</div>
    <div class="tag">doc_lint.py</div>
  </div>
</body></html>
